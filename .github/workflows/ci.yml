name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-unit:
    name: 构建与单元测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: 安装依赖
        run: npm install --no-audit --no-fund

      - name: 生成 Prisma Client
        run: npm run prisma:generate -w @hedging/business

      - name: 业务服务单元测试
        run: npm run test -w @hedging/business

      - name: Runtime 单元测试
        run: npm run test -w @hedging/runtime

      - name: 前端剥离逻辑测试
        run: npm run test -w @hedging/admin-web

      - name: 构建全部服务与前端
        run: |
          npm run build -w @hedging/business
          npm run build -w @hedging/runtime
          npm run build -w @hedging/admin-web

  system-e2e:
    name: 系统级 E2E（docker compose）
    runs-on: ubuntu-latest
    needs: build-and-unit
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 启动 compose 栈
        run: docker compose up -d --build

      - name: 运行系统级测试
        run: node tests/system/system.e2e.mjs

      - name: 失败时导出日志
        if: failure()
        run: docker compose logs --no-color

      - name: 关闭 compose
        if: always()
        run: docker compose down -v
